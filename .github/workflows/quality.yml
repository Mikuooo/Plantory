name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository structure
        run: pnpm check:repo

      - name: Check documentation
        run: pnpm check:docs

      - name: Test architecture harness
        run: pnpm test:architecture-harness

      - name: Check architecture
        run: pnpm check:architecture

      - name: Check Expo compatibility
        run: pnpm check:expo

      - name: Test E2E harness
        shell: pwsh
        run: ./scripts/harness/process-runner.test.ps1

      - name: Test quality trends
        run: pnpm test:quality-trends

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
